<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hearth Cribbage</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    background: #0a0908 url('table_bg.jpg') center/cover fixed;
    color: #f7f1e8;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px 12px;
  }
  .table {
    background: linear-gradient(180deg, rgba(18,14,10,.92), rgba(10,8,6,.94));
    backdrop-filter: blur(8px);
    border-radius: 28px;
    padding: 28px 26px 24px;
    width: min(1080px, 98vw);
    box-shadow: 0 40px 100px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.06);
    border: 1px solid rgba(212,175,55,.22);
    contain: layout style;
  }
  h1 { text-align: center; font-family: "Cormorant Garamond", serif; color: #f0d78c; letter-spacing: 6px; font-size: 2.8rem; font-weight: 600; margin-bottom: 4px; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  .sub { text-align: center; opacity: .5; font-size: .7rem; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 20px; font-weight: 500; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 16px; flex-wrap: wrap; }
  .score { background: rgba(0,0,0,.5); border: 1px solid rgba(240,215,140,.2); padding: 12px 28px; border-radius: 14px; font-size: 1.6rem; font-weight: 600; min-width: 140px; text-align: center; }
  .score.you { color: #f5d76e; }
  .score.grok { color: #8fd3f4; }
  select { background: rgba(0,0,0,.55); color: #f7f1e8; border: 1px solid rgba(240,215,140,.3); padding: 10px 18px; border-radius: 12px; font-size: .95rem; cursor: pointer; outline: none; }
  .board-wrap { position: relative; margin: 8px auto 16px; max-width: 700px; contain: layout; }
  .board-wrap img { width: 100%; border-radius: 18px; display: block; box-shadow: 0 20px 50px rgba(0,0,0,.75); will-change: contents; }
  .peg { position: absolute; width: 20px; height: 52px; background-size: contain; background-repeat: no-repeat; background-position: center bottom; pointer-events: none; transition: left .5s cubic-bezier(.22,.8,.3,1), top .5s cubic-bezier(.22,.8,.3,1); filter: drop-shadow(0 5px 6px rgba(0,0,0,.65)); z-index: 3; will-change: left, top; }
  .peg.you { background-image: url('peg_brass.jpg'); }
  .peg.grok { background-image: url('peg_steel.jpg'); }
  .count { text-align: center; font-size: 2.2rem; font-weight: 600; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.8); margin: 4px 0 12px; }
  .area { display: grid; grid-template-columns: 120px 1fr 120px; gap: 16px; }
  .panel { background: rgba(0,0,0,.4); border-radius: 14px; padding: 12px 8px; text-align: center; border: 1px solid rgba(255,255,255,.04); }
  .panel h3 { font-size: .62rem; letter-spacing: 1.8px; opacity: .55; margin-bottom: 10px; text-transform: uppercase; font-weight: 600; }
  .cards { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; min-height: 110px; }
  .card { width: 66px; height: 98px; background: linear-gradient(180deg, #fff, #f8f6f2); border-radius: 8px; box-shadow: 0 8px 18px rgba(0,0,0,.55); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; cursor: pointer; transition: transform .14s; contain: layout style; }
  .card:hover { transform: translateY(-10px); }
  .card.sel { outline: 3px solid #f0d78c; transform: translateY(-12px); }
  .card.back { background: url('card_back.jpg') center/cover; color: transparent; }
  .card .r { font-size: 1.2rem; line-height: 1; }
  .card .s { font-size: 1.4rem; line-height: 1; }
  .card.red { color: #c0392b; }
  .card.black { color: #1a1a1a; }
  .msg { background: rgba(0,0,0,.55); border-radius: 12px; padding: 14px 16px; text-align: center; margin: 16px 0; font-size: 1.02rem; }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button { background: linear-gradient(180deg, #e6c35c, #b8860b); color: #1a1205; border: none; padding: 11px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: .92rem; }
  button:disabled { opacity: .4; cursor: not-allowed; }
</style>
</head>
<body>
<div class="table">
  <h1>HEARTH CRIBBAGE</h1>
  <div class="sub">Premium Play</div>
  <div class="bar">
    <div class="score you">You <span id="ps">0</span></div>
    <select id="boardSel">
      <option value="board_luxury.jpg">Luxury Walnut + Brass</option>
      <option value="board_maple.jpg">Sculpted Maple</option>
      <option value="board_steam.jpg">Steampunk</option>
      <option value="board_deco.jpg">Art Deco</option>
      <option value="board_classic.jpg">Classic Three-Track</option>
    </select>
    <div class="score grok">Grok <span id="gs">0</span></div>
  </div>
  <div class="board-wrap">
    <img id="board" src="board_luxury.jpg" alt="Cribbage Board" loading="eager">
    <div class="peg you" id="pYou"></div>
    <div class="peg grok" id="pGrok"></div>
  </div>
  <div class="count" id="count">0</div>
  <div class="area">
    <div class="panel"><h3>Starter</h3><div id="starter" class="cards"></div></div>
    <div class="panel"><h3>Your Hand</h3><div id="hand" class="cards"></div></div>
    <div class="panel"><h3>Crib</h3><div id="crib" class="cards"></div></div>
  </div>
  <div class="msg" id="msg">Select two cards to discard to the crib.</div>
  <div class="btns">
    <button id="discard" disabled>Discard 2</button>
    <button id="b2">+2</button>
    <button id="b5">+5</button>
    <button id="bg4">+4 Grok</button>
    <button id="newH">New Hand</button>
    <button id="newG">New Game</button>
  </div>
</div>
<script>
const R = ['A','2','3','4','5','6','7','8','9','T','J','Q','K'];
const S = ['\u2660','\u2665','\u2666','\u2663'];
const ord = Object.fromEntries(R.map((r,i)=>[r,i]));
const red = new Set(['\u2665','\u2666']);

const $ = id => document.getElementById(id);
const el = {
  ps: $('ps'), gs: $('gs'), board: $('board'), boardSel: $('boardSel'),
  pYou: $('pYou'), pGrok: $('pGrok'), count: $('count'),
  hand: $('hand'), starter: $('starter'), crib: $('crib'),
  msg: $('msg'), discard: $('discard')
};

let st = { scores:{player:0,grok:0}, hand:[], crib:[], starter:null, phase:'discard' };
const sel = new Set();
let pegRAF = 0;

const shuf = a => { for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
const deck = () => R.flatMap(r => S.map(s => r+s));
const sort = h => h.slice().sort((a,b) => ord[a[0]]-ord[b[0]]);

function pos(score) {
  const p = Math.min(score,120)/120;
  return { left:(8+p*78)+'%', top:(34+Math.sin(p*Math.PI*1.6)*14)+'%' };
}
function updatePegs() {
  cancelAnimationFrame(pegRAF);
  pegRAF = requestAnimationFrame(() => {
    const y = pos(st.scores.player), g = pos(st.scores.grok);
    el.pYou.style.left = y.left; el.pYou.style.top = y.top;
    el.pGrok.style.left = g.left; el.pGrok.style.top = (parseFloat(g.top)+9)+'%';
  });
}

function score(who, pts) {
  st.scores[who] = Math.min(121, st.scores[who]+pts);
  (who==='player'?el.ps:el.gs).textContent = st.scores[who];
  updatePegs();
  el.msg.textContent = (who==='player'?'You':'Grok') + ' score ' + pts + (st.scores[who]>=121?' Game over!':'.');
}

function newHand() {
  const d = shuf(deck());
  st.hand = sort(d.slice(0,6));
  st.crib = []; st.starter = null; st.phase = 'discard';
  sel.clear();
  el.msg.textContent = 'Select two cards to discard to the crib.';
  el.count.textContent = '0';
  render();
}
function newGame() { st.scores = {player:0,grok:0}; newHand(); }

function mkCard(c, back, click) {
  const elCard = document.createElement('div');
  elCard.className = 'card' + (back?' back':'') + (c && red.has(c[1])?' red':' black');
  if (!back && c) {
    const r = document.createElement('div'); r.className='r'; r.textContent = c[0]==='T'?'10':c[0];
    const s = document.createElement('div'); s.className='s'; s.textContent = c[1];
    elCard.append(r, s);
  }
  if (click) elCard.onclick = () => {
    if (st.phase!=='discard') return;
    if (sel.has(c)) { sel.delete(c); elCard.classList.remove('sel'); }
    else if (sel.size<2) { sel.add(c); elCard.classList.add('sel'); }
    el.discard.disabled = sel.size!==2;
  };
  return elCard;
}

function fill(container, items, back, click) {
  const frag = document.createDocumentFragment();
  for (const c of items) frag.appendChild(mkCard(c, back, click));
  container.replaceChildren(frag);
}

function render() {
  el.ps.textContent = st.scores.player;
  el.gs.textContent = st.scores.grok;
  fill(el.hand, st.hand, false, st.phase==='discard');
  el.starter.replaceChildren();
  if (st.starter) el.starter.appendChild(mkCard(st.starter, false, false));
  fill(el.crib, st.crib, true, false);
  el.discard.disabled = sel.size!==2 || st.phase!=='discard';
  updatePegs();
}

el.boardSel.onchange = () => { el.board.src = el.boardSel.value; updatePegs(); };
el.discard.onclick = () => {
  if (sel.size!==2) return;
  const disc = [...sel];
  st.hand = st.hand.filter(c => !sel.has(c));
  st.crib.push(...disc);
  st.starter = shuf(deck()).find(c => !st.hand.includes(c) && !st.crib.includes(c));
  if (st.starter[0]==='J') score('player',2);
  st.phase = 'play';
  el.msg.textContent = 'Starter cut. Use score buttons to move the pegs.';
  sel.clear();
  render();
};
$('b2').onclick = () => score('player',2);
$('b5').onclick = () => score('player',5);
$('bg4').onclick = () => score('grok',4);
$('newH').onclick = newHand;
$('newG').onclick = newGame;

// Preload boards
['board_luxury.jpg','board_maple.jpg','board_steam.jpg','board_deco.jpg','board_classic.jpg'].forEach(src => {
  const img = new Image(); img.src = src;
});

newHand();
updatePegs();
</script>
</body>
</html>

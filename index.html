<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hearth Cribbage</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    background: #0a0908 url('table_bg.jpg') center/cover fixed;
    color: #f7f1e8;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px 12px;
  }
  .table {
    background: linear-gradient(180deg, rgba(18,14,10,.92), rgba(10,8,6,.94));
    backdrop-filter: blur(8px);
    border-radius: 28px;
    padding: 28px 26px 24px;
    width: min(1080px, 98vw);
    box-shadow:
      0 40px 100px rgba(0,0,0,.9),
      inset 0 1px 0 rgba(255,255,255,.06);
    border: 1px solid rgba(212,175,55,.22);
  }
  h1 {
    text-align: center;
    font-family: "Cormorant Garamond", serif;
    color: #f0d78c;
    letter-spacing: 6px;
    font-size: 2.8rem;
    font-weight: 600;
    margin-bottom: 4px;
    text-shadow: 0 2px 12px rgba(0,0,0,.6);
  }
  .sub {
    text-align: center;
    opacity: .5;
    font-size: .7rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 20px;
    font-weight: 500;
  }
  .bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .score {
    background: rgba(0,0,0,.5);
    border: 1px solid rgba(240,215,140,.2);
    padding: 12px 28px;
    border-radius: 14px;
    font-size: 1.6rem;
    font-weight: 600;
    min-width: 140px;
    text-align: center;
    letter-spacing: .5px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
  }
  .score.you { color: #f5d76e; }
  .score.grok { color: #8fd3f4; }
  select {
    background: rgba(0,0,0,.55);
    color: #f7f1e8;
    border: 1px solid rgba(240,215,140,.3);
    padding: 10px 18px;
    border-radius: 12px;
    font-size: .95rem;
    font-weight: 500;
    cursor: pointer;
    outline: none;
  }
  select:hover { border-color: rgba(240,215,140,.5); }
  .board-wrap {
    position: relative;
    margin: 8px auto 16px;
    max-width: 700px;
  }
  .board-wrap img {
    width: 100%;
    border-radius: 18px;
    display: block;
    box-shadow: 0 20px 50px rgba(0,0,0,.75);
  }
  .peg {
    position: absolute;
    width: 20px;
    height: 52px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center bottom;
    pointer-events: none;
    transition: left .6s cubic-bezier(.22,.8,.3,1), top .6s cubic-bezier(.22,.8,.3,1);
    filter: drop-shadow(0 5px 6px rgba(0,0,0,.65));
    z-index: 3;
  }
  .peg.you { background-image: url('peg_brass.jpg'); }
  .peg.grok { background-image: url('peg_steel.jpg'); }
  .count {
    text-align: center;
    font-size: 2.2rem;
    font-weight: 600;
    color: #fff;
    text-shadow: 0 2px 10px rgba(0,0,0,.8);
    margin: 4px 0 12px;
    letter-spacing: 1px;
  }
  .area {
    display: grid;
    grid-template-columns: 120px 1fr 120px;
    gap: 16px;
  }
  .panel {
    background: rgba(0,0,0,.4);
    border-radius: 14px;
    padding: 12px 8px;
    text-align: center;
    border: 1px solid rgba(255,255,255,.04);
  }
  .panel h3 {
    font-size: .62rem;
    letter-spacing: 1.8px;
    opacity: .55;
    margin-bottom: 10px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .cards {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    min-height: 110px;
  }
  .card {
    width: 66px;
    height: 98px;
    background: linear-gradient(180deg, #fff, #f8f6f2);
    border-radius: 8px;
    box-shadow: 0 8px 18px rgba(0,0,0,.55);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    cursor: pointer;
    transition: transform .16s cubic-bezier(.22,.8,.3,1), box-shadow .16s;
  }
  .card:hover {
    transform: translateY(-10px);
    box-shadow: 0 14px 28px rgba(0,0,0,.65);
  }
  .card.sel {
    outline: 3px solid #f0d78c;
    transform: translateY(-12px);
    box-shadow: 0 16px 32px rgba(240,215,140,.25);
  }
  .card.back {
    background: url('card_back.jpg') center/cover;
    color: transparent;
  }
  .card .r { font-size: 1.2rem; line-height: 1; }
  .card .s { font-size: 1.4rem; line-height: 1; }
  .card.red { color: #c0392b; }
  .card.black { color: #1a1a1a; }
  .msg {
    background: rgba(0,0,0,.55);
    border-radius: 12px;
    padding: 14px 16px;
    text-align: center;
    margin: 16px 0;
    font-size: 1.02rem;
    border: 1px solid rgba(240,215,140,.1);
    letter-spacing: .3px;
  }
  .btns {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  button {
    background: linear-gradient(180deg, #e6c35c, #b8860b);
    color: #1a1205;
    border: none;
    padding: 11px 20px;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    font-size: .92rem;
    letter-spacing: .3px;
    box-shadow: 0 4px 0 #7a5c00, 0 6px 12px rgba(0,0,0,.4);
    transition: transform .1s, box-shadow .1s;
  }
  button:hover { filter: brightness(1.06); }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 #7a5c00; }
  button:disabled { opacity: .4; cursor: not-allowed; filter: none; }
</style>
</head>
<body>
<div class="table">
  <h1>HEARTH CRIBBAGE</h1>
  <div class="sub">Premium Play</div>

  <div class="bar">
    <div class="score you">You <span id="ps">0</span></div>
    <select id="boardSel" onchange="swapBoard()">
      <option value="board_luxury.jpg">Luxury Walnut + Brass</option>
      <option value="board_maple.jpg">Sculpted Maple</option>
      <option value="board_steam.jpg">Steampunk</option>
      <option value="board_deco.jpg">Art Deco</option>
      <option value="board_classic.jpg">Classic Three-Track</option>
    </select>
    <div class="score grok">Grok <span id="gs">0</span></div>
  </div>

  <div class="board-wrap">
    <img id="board" src="board_luxury.jpg" alt="Cribbage Board">
    <div class="peg you" id="pYou"></div>
    <div class="peg grok" id="pGrok"></div>
  </div>

  <div class="count" id="count">0</div>

  <div class="area">
    <div class="panel"><h3>Starter</h3><div id="starter" class="cards"></div></div>
    <div class="panel"><h3>Your Hand</h3><div id="hand" class="cards"></div></div>
    <div class="panel"><h3>Crib</h3><div id="crib" class="cards"></div></div>
  </div>

  <div class="msg" id="msg">Select two cards to discard to the crib.</div>

  <div class="btns">
    <button id="discard" disabled>Discard 2</button>
    <button onclick="score('player',2)">+2</button>
    <button onclick="score('player',5)">+5</button>
    <button onclick="score('grok',4)">+4 Grok</button>
    <button onclick="newHand()">New Hand</button>
    <button onclick="newGame()">New Game</button>
  </div>
</div>

<script>
const R = ['A','2','3','4','5','6','7','8','9','T','J','Q','K'];
const S = ['♠','♥','♦','♣'];
const ord = Object.fromEntries(R.map((r,i)=>[r,i]));
let st = { scores:{player:0,grok:0}, hand:[], crib:[], starter:null, phase:'discard' };
const sel = new Set();

const shuf = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const deck = () => R.flatMap(r => S.map(s => r+s));
const sort = h => [...h].sort((a,b) => ord[a[0]]-ord[b[0]]);

function pos(score) {
  const p = Math.min(score,120)/120;
  return { left:(8+p*78)+'%', top:(34+Math.sin(p*Math.PI*1.6)*14)+'%' };
}
function updatePegs() {
  const y = pos(st.scores.player), g = pos(st.scores.grok);
  document.getElementById('pYou').style.left = y.left;
  document.getElementById('pYou').style.top = y.top;
  document.getElementById('pGrok').style.left = g.left;
  document.getElementById('pGrok').style.top = (parseFloat(g.top)+9)+'%';
}
function swapBoard() { document.getElementById('board').src = document.getElementById('boardSel').value; updatePegs(); }

function score(who, pts) {
  st.scores[who] = Math.min(121, st.scores[who]+pts);
  document.getElementById(who==='player'?'ps':'gs').textContent = st.scores[who];
  updatePegs();
  document.getElementById('msg').textContent = (who==='player'?'You':'Grok') + ' score ' + pts + '.';
  if (st.scores[who] >= 121) document.getElementById('msg').textContent += ' Game over!';
}

function newHand() {
  const d = shuf(deck());
  st.hand = sort(d.slice(0,6));
  st.crib = []; st.starter = null; st.phase = 'discard';
  sel.clear();
  document.getElementById('msg').textContent = 'Select two cards to discard to the crib.';
  document.getElementById('count').textContent = '0';
  render();
}
function newGame() { st.scores = {player:0,grok:0}; newHand(); }

function mkCard(c, back=false, click=false) {
  const el = document.createElement('div');
  el.className = 'card' + (back?' back':'') + (c && ['♥','♦'].includes(c[1])?' red':' black');
  if (!back && c) el.innerHTML = `<div class="r">${c[0]==='T'?'10':c[0]}</div><div class="s">${c[1]}</div>`;
  if (click) el.onclick = () => {
    if (st.phase!=='discard') return;
    if (sel.has(c)) { sel.delete(c); el.classList.remove('sel'); }
    else if (sel.size<2) { sel.add(c); el.classList.add('sel'); }
    document.getElementById('discard').disabled = sel.size!==2;
  };
  return el;
}

function render() {
  document.getElementById('ps').textContent = st.scores.player;
  document.getElementById('gs').textContent = st.scores.grok;
  const h = document.getElementById('hand'); h.innerHTML='';
  st.hand.forEach(c => h.appendChild(mkCard(c,false,st.phase==='discard')));
  const s = document.getElementById('starter'); s.innerHTML='';
  if (st.starter) s.appendChild(mkCard(st.starter));
  const c = document.getElementById('crib'); c.innerHTML='';
  st.crib.forEach(card => c.appendChild(mkCard(card,true)));
  document.getElementById('discard').disabled = sel.size!==2 || st.phase!=='discard';
  updatePegs();
}

document.getElementById('discard').onclick = () => {
  if (sel.size!==2) return;
  const disc = [...sel];
  st.hand = st.hand.filter(c => !sel.has(c));
  st.crib.push(...disc);
  st.starter = shuf(deck()).find(c => ![...st.hand,...st.crib].includes(c));
  if (st.starter[0]==='J') score('player',2);
  st.phase = 'play';
  document.getElementById('msg').textContent = 'Starter cut. Use score buttons to move the pegs.';
  sel.clear();
  render();
};

newHand();
updatePegs();
</script>
</body>
</html>
